name: macos-arm64

on:
  push:
    branches: [mac_port]
  workflow_dispatch:

jobs:
  build-dmg:
    # arm64 (Apple Silicon) macOS runner
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # refresh formulae: the runner image snapshot is older than the
          # development environment; cmake 4.4.3 (preinstalled on the image)
          # has a path-with-space bug in BundleUtilities, so upgrade it too
          brew update
          brew upgrade cmake
          brew install pkg-config bison gettext boost \
            apr apr-util freetype fribidi gmp graphite2 hunspell jpeg-turbo \
            libpng libzzip log4cxx mpfi mpfr pixman popt uriparser xz zlib \
            bzip2 expat curl icu4c openssl@3 cairo fontconfig gd harfbuzz qt

      - name: Configure
        run: |
          BREW="$(brew --prefix)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_PREFIX_PATH="$BREW;$BREW/opt/icu4c;$BREW/opt/openssl@3;$BREW/opt/bzip2;$BREW/opt/expat;$BREW/opt/curl;$BREW/opt/zlib" \
            -DMIKTEX_MACOS_BUNDLE=TRUE \
            -DWITH_UI_QT=TRUE

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        # serial: parallel ctest has known ordering flakes (see docs/macos-port/NOTES.md)
        run: ctest --test-dir build --output-on-failure

      - name: Package
        # guard against a hanging Finder layout script or hdiutil
        timeout-minutes: 30
        run: |
          echo "=== tool versions ==="
          brew list --versions cmake qt qtbase | cat
          cmake --version | head -1
          echo "=== Qt plugin link layout ==="
          # a fresh Homebrew install links the plugins as per-file symlinks
          # into the Cellar (see cmake/modules/InstallQtPlugin.cmake)
          ls -ld "$(brew --prefix)/share/qt/plugins/platforms"
          ls -l "$(brew --prefix)/share/qt/plugins/platforms/"
          echo "=== cpack ==="
          cd build
          cpack -G DragNDrop

      # always: the logs of a successful run show whether the sandbox tools
      # raced while creating the file name database
      - name: Upload sandbox logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: build/sandbox/miktex/log/
          if-no-files-found: ignore

      - name: Verify
        run: |
          app=$(ls -d build/_CPack_Packages/Darwin/DragNDrop/miktex-*/MiKTeX\ Console.app)
          file "$app/Contents/MacOS/MiKTeX Console"
          codesign --verify --strict "$app"
          shasum -a 256 build/*.dmg

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: miktex-darwin-arm64-dmg
          path: build/*.dmg
          if-no-files-found: error
